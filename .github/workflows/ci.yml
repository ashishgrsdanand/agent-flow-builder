# Checks the project on every push and pull request: types, tests and a build.
# It does not publish anything: Netlify builds and publishes the site by itself.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # After your first `npm install`, commit package-lock.json and change this to `npm ci`.
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
